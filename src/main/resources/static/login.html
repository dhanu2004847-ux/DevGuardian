<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevGuardian — Authentication</title>
    <style>
        :root {
          --bg: #0B1120;
          --surface: #111A2E;
          --surface-2: #16233D;
          --border: #233252;
          --text: #E2E8F0;
          --text-dim: #8FA0BF;
          --accent: #22D3A6;
          --critical: #F0475D;
          --mono: 'JetBrains Mono', monospace;
          --sans: 'Inter', -apple-system, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          background: var(--bg);
          color: var(--text);
          font-family: var(--sans);
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
        }
        .auth-container {
          width: 100%;
          max-width: 400px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 32px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .brand {
          font-family: var(--mono);
          font-size: 18px;
          color: var(--accent);
          font-weight: bold;
          margin-bottom: 4px;
          text-align: center;
        }
        .subtitle {
          font-size: 13px;
          color: var(--text-dim);
          text-align: center;
          margin-bottom: 28px;
        }
        .form-group {
          margin-bottom: 16px;
        }
        label {
          display: block;
          font-size: 12px;
          color: var(--text-dim);
          margin-bottom: 6px;
          text-transform: uppercase;
          letter-spacing: .03em;
        }
        input {
          width: 100%;
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 6px;
          padding: 10px 12px;
          color: var(--text);
          font-size: 14px;
          font-family: var(--sans);
        }
        input:focus {
          outline: none;
          border-color: var(--accent);
        }
        .btn {
          width: 100%;
          background: var(--accent);
          color: #0B1120;
          border: none;
          padding: 10px;
          font-weight: 600;
          font-size: 14px;
          border-radius: 6px;
          cursor: pointer;
          margin-top: 10px;
          transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.9; }
        .error-msg {
          color: var(--critical);
          font-size: 12.5px;
          margin-top: 12px;
          text-align: center;
          display: none;
        }
        .toggle-mode {
          text-align: center;
          margin-top: 20px;
          font-size: 13px;
          color: var(--text-dim);
        }
        .toggle-mode a {
          color: var(--accent);
          text-decoration: none;
          cursor: pointer;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="brand">devguardian/</div>
    <div id="form-title" class="subtitle">Sign in to your security workspace</div>

    <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" required placeholder="developer@devguardian.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" id="submit-btn" class="btn">Sign In</button>
        <div id="error-box" class="error-msg"></div>
    </form>

    <div class="toggle-mode">
        <span id="toggle-text">Don't have an account?</span>
        <a onclick="toggleMode()">Register</a>
    </div>
</div>

<script>
    let isLoginMode = true;

    function toggleMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('form-title').innerText = isLoginMode ? "Sign in to your security workspace" : "Create a new developer account";
      document.getElementById('submit-btn').innerText = isLoginMode ? "Sign In" : "Register Account";
      document.getElementById('toggle-text').innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
      document.querySelector('.toggle-mode a').innerText = isLoginMode ? "Register" : "Sign In";
      document.getElementById('error-box').style.display = 'none';
    }

    async function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');

      const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (!response.ok) {
          throw new Error(isLoginMode ? 'Invalid email or password' : 'Registration failed. Email may already be in use.');
        }

        const data = await response.json();

        if (isLoginMode) {
          // Store JWT access token in browser session storage
          localStorage.setItem('jwt_token', data.accessToken || data.token);
          window.location.href = '/index.html';
        } else {
          alert('Registration successful! Please sign in.');
          toggleMode();
        }
      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
      }
    }
</script>

</body>
</html>
